name: Verify published Android release

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable release tag to verify
        required: true
        type: string

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.44.8
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  verify:
    name: Verify source and public signed APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}
      - name: Verify stable tag, release metadata, and main ancestry
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          declared_version="$(
            awk '/^version:[[:space:]]+/ { print $2; exit }' \
              apps/devcoordinator/pubspec.yaml
          )"
          version_name="${declared_version%%+*}"
          build_number="${declared_version##*+}"
          if [[ ! "$version_name" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ \
            || ! "$build_number" =~ ^[1-9][0-9]*$ \
            || "$RELEASE_TAG" != "v$version_name" ]]; then
            echo "Release tag does not match the declared Android version." >&2
            exit 1
          fi
          release="$(
            gh release view "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --json isDraft,isPrerelease,tagName
          )"
          test "$(jq -r '.tagName' <<<"$release")" = "$RELEASE_TAG"
          test "$(jq -r '.isDraft' <<<"$release")" = false
          test "$(jq -r '.isPrerelease' <<<"$release")" = false
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD origin/main
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$(git rev-parse HEAD)"
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.14.4'
          cache: pip
          cache-dependency-path: tool/requirements-openapi.txt
      - name: Install contract validator dependencies
        run: >-
          python -m pip install
          --require-hashes
          --requirement tool/requirements-openapi.txt
      - name: Verify native gateway contract
        run: >-
          python tool/validate_native_gateway.py
          --self-test
          contracts/native-gateway.openapi.yaml
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Verify source behavior
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          dart format --output=none --set-exit-if-changed .
          flutter analyze
          flutter test packages/coordinator_client
          flutter test packages/devcoordinator_design
          flutter test packages/release_update
          flutter test apps/devcoordinator
      - name: Download release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version_name="${RELEASE_TAG#v}"
          apk_name="DevCoordinator-$version_name-android.apk"
          checksum_name="$apk_name.sha256"
          install -d -m 755 "$RUNNER_TEMP/devcoordinator-release"
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$RUNNER_TEMP/devcoordinator-release" \
            --pattern "$apk_name" \
            --pattern "$checksum_name"
          test -f "$RUNNER_TEMP/devcoordinator-release/$apk_name"
          test -f "$RUNNER_TEMP/devcoordinator-release/$checksum_name"
          read -r expected_hash expected_name unexpected \
            <"$RUNNER_TEMP/devcoordinator-release/$checksum_name"
          if [[ ! "$expected_hash" =~ ^[0-9a-f]{64}$ \
            || "$expected_name" != "$apk_name" \
            || -n "${unexpected:-}" ]]; then
            echo "Published checksum has an invalid format or target." >&2
            exit 1
          fi
          (
            cd "$RUNNER_TEMP/devcoordinator-release"
            sha256sum --check --strict "$checksum_name"
          )
          tool/verify_android_release_artifact.sh \
            "$RUNNER_TEMP/devcoordinator-release/$apk_name"
      - name: Verify anonymous latest-release discovery
        shell: bash
        run: |
          set -euo pipefail
          response="$(
            curl --fail --silent --show-error \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/latest"
          )"
          test "$(jq -r '.tag_name' <<<"$response")" = "$RELEASE_TAG"
          test "$(jq -r '.draft' <<<"$response")" = false
          test "$(jq -r '.prerelease' <<<"$response")" = false
