name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.44.8

jobs:
  quality:
    name: Format, analyze, and test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.14.4'
          cache: pip
          cache-dependency-path: tool/requirements-openapi.txt
      - name: Install contract validator dependencies
        run: >-
          python -m pip install
          --require-hashes
          --requirement tool/requirements-openapi.txt
      - name: Exercise and run native gateway validator
        run: >-
          python tool/validate_native_gateway.py
          --self-test
          contracts/native-gateway.openapi.yaml
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test packages/coordinator_client
      - run: flutter test packages/devcoordinator_design
      - run: flutter test packages/release_update
      - run: flutter test apps/devcoordinator

  target-build:
    name: ${{ matrix.name }} build smoke
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Android
            os: ubuntu-24.04
            build-arguments: apk --debug
            upload_smoke: false
          - name: Android release smoke
            os: ubuntu-24.04
            build-arguments: apk --release
            upload_smoke: false
          - name: macOS
            os: macos-15-intel
            build-arguments: macos --release
            xcode_archs: x86_64 arm64
            xcode_only_active_arch: 'NO'
            upload_smoke: true
            artifact_name: macos-adhoc-smoke
            artifact_path: source/apps/devcoordinator/build/smoke/macos/*
          - name: Windows
            os: windows-2025
            build-arguments: windows --release
            upload_smoke: true
            artifact_name: windows-self-signed-smoke
            artifact_path: source/apps/devcoordinator/build/windows/**/*.msix
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/devcoordinator
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: source
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Resolve workspace
        working-directory: source
        run: flutter pub get --enforce-lockfile
      - name: Build target
        working-directory: source/apps/devcoordinator
        env:
          FLUTTER_XCODE_ARCHS: ${{ matrix.xcode_archs }}
          FLUTTER_XCODE_ONLY_ACTIVE_ARCH: ${{ matrix.xcode_only_active_arch }}
        run: >-
          flutter build ${{ matrix.build-arguments }}
          --dart-define=UPDATE_REPOSITORY=${{ github.repository }}
      - name: Package Windows protocol activation as MSIX
        if: matrix.name == 'Windows'
        working-directory: source/apps/devcoordinator
        run: >-
          dart run msix:create
          --build-windows false
          --install-certificate false
      - name: Verify and archive the ad-hoc macOS smoke app
        if: matrix.name == 'macOS'
        working-directory: source
        run: >-
          tool/package_macos_smoke.sh
          apps/devcoordinator/build/macos/Build/Products/Release/DevCoordinator.app
      - name: Run Android release lint
        if: matrix.name == 'Android release smoke'
        working-directory: source/apps/devcoordinator/android
        run: ./gradlew :app:lintRelease
      - name: Upload clearly labeled short-lived smoke artifact
        if: matrix.upload_smoke == true
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          retention-days: 7
