name: devcoordinator
description: "Universal DevCoordinator client for Android, macOS, and Windows."
publish_to: 'none'
version: 0.2.1+3

environment:
  sdk: ^3.12.2

resolution: workspace

dependencies:
  app_links: ^7.2.1
  crypto: ^3.0.7
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  coordinator_client: ^0.2.0
  cupertino_icons: ^1.0.9
  devcoordinator_design: ^0.1.0
  flutter_secure_storage: ^10.3.1
  http: ^1.6.0
  package_info_plus: ^10.2.1
  pub_semver: ^2.2.0
  release_update: ^0.2.0
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  msix: ^3.18.0

flutter:
  uses-material-design: true

msix_config:
  display_name: DevCoordinator
  msix_version: 0.2.1.3
  protocol_activation: io.github.holyglory.devcoordinator
