        token:
          type: string
          minLength: 1
          maxLength: 4096
          writeOnly: true
        label:
          type:
            - string
            - 'null'
          maxLength: 120
        takeOverWebhook:
          type: boolean
          default: false
          description: Must be explicitly true to replace an existing webhook.
    TelegramProjectAssignmentRequest:
      type: object
      additionalProperties: false
      required:
        - projectIds
      properties:
        projectIds:
          type: array
          uniqueItems: true
          maxItems: 500
          items:
            type: string
    UnassignedResourceCollection:
      type: object
      additionalProperties: false
      required:
        - revision
        - observedAt
        - resources
        - blockers
      properties:
        revision:
          type: string
        observedAt:
          type: string
          format: date-time
        resources:
          type: array
          items:
            $ref: '#/components/schemas/UnassignedResource'
        blockers:
          type: array
          items:
            $ref: '#/components/schemas/Blocker'
    UnassignedResource:
      type: object
      additionalProperties: false
      required:
        - id
        - kind
        - displayName
        - state
        - observedBy
        - controller
        - attribution
        - immutableFingerprint
        - controlBindingId
        - ownershipFingerprint
        - candidates
        - allowedActions
        - blockers
        - observedAt
      properties:
        id:
          type: string
          description: Immutable physical host-resource identity.
        kind:
          type: string
          enum:
            - server
            - container
            - database
            - worktree
        displayName:
          type: string
        state:
          $ref: '#/components/schemas/ResourceState'
        observedBy:
          type: string
          description: Source that supplied observation evidence.
        controller:
          type:
            - string
            - 'null'
          description: Proved mutation authority, or null when no safe controller exists.
        attribution:
          $ref: '#/components/schemas/AttributionReason'
        immutableFingerprint:
          type: string
        controlBindingId:
          type:
            - string
            - 'null'
        ownershipFingerprint:
          type:
            - string
            - 'null'
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/RepositoryCandidate'
        allowedActions:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
              - attach
              - retire
        blockers:
          type: array
          items:
            $ref: '#/components/schemas/Blocker'
        observedAt:
          type: string
          format: date-time
    AttributionReason:
      type: object
