    HostPerformanceSnapshot:
      type: object
      additionalProperties: false
      required:
        - sampledAt
        - cpuPercent
        - cores
        - loadAverage
        - uptimeSeconds
        - memory
        - disks
      properties:
        sampledAt:
          type: string
          format: date-time
        cpuPercent:
          type:
            - number
            - 'null'
          minimum: 0
        cores:
          type: integer
          minimum: 1
        loadAverage:
          type: array
          minItems: 3
          maxItems: 3
          items:
            type: number
            minimum: 0
        uptimeSeconds:
          type: integer
          minimum: 0
        memory:
          $ref: '#/components/schemas/HostMemory'
        disks:
          type: array
          items:
            $ref: '#/components/schemas/DiskUsage'
    HostMemory:
      type: object
      additionalProperties: false
      required:
        - totalBytes
        - usedBytes
        - availableBytes
      properties:
        totalBytes:
          type: integer
          minimum: 0
        usedBytes:
          type: integer
          minimum: 0
        availableBytes:
          type: integer
          minimum: 0
    DiskUsage:
      type: object
      additionalProperties: false
      required:
        - mountLabel
        - totalBytes
        - usedBytes
        - availableBytes
      properties:
        mountLabel:
          type: string
          description: Server-redacted display label, not necessarily a host path.
        totalBytes:
          type: integer
          minimum: 0
        usedBytes:
          type: integer
          minimum: 0
        availableBytes:
          type: integer
          minimum: 0
    PerformanceSeries:
      type: object
      additionalProperties: false
      required:
        - key
        - kind
        - resourceId
        - projectId
        - displayName
        - running
        - stale
        - points
      properties:
        key:
          type: string
        kind:
          type: string
          enum:
            - host
            - server
            - container
            - project
        resourceId:
          type:
            - string
            - 'null'
        projectId:
          type:
            - string
            - 'null'
        displayName:
          type: string
        running:
          type: boolean
        stale:
          type: boolean
        points:
          type: array
          maxItems: 400
          items:
            $ref: '#/components/schemas/PerformancePoint'
    PerformancePoint:
      type: object
      additionalProperties: false
      required:
        - sampledAt
        - cpuPercent
        - memoryBytes
      properties:
        sampledAt:
          type: string
          format: date-time
        cpuPercent:
          type:
            - number
            - 'null'
          minimum: 0
        memoryBytes:
          type:
            - integer
            - 'null'
          minimum: 0
    Problem:
      type: object
      additionalProperties: true
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          type: string
        requestId:
          type: string
        blockers:
          type: array
          items:
            $ref: '#/components/schemas/Blocker'
