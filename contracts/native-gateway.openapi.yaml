        resourceIds:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            type: string
        reason:
          type: string
          minLength: 1
          maxLength: 300
    BulkOperationPlan:
      type: object
      additionalProperties: false
      required:
        - id
        - fingerprint
        - action
        - targets
        - blockers
        - confirmationPhrase
        - expiresAt
