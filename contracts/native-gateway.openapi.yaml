        - evidence
      properties:
        code:
          type: string
          enum:
            - name_only
            - repository_missing
            - repository_not_git
            - conflicting_claims
            - ambiguous_controller
            - stale_observation
            - unknown
        message:
          type: string
        evidence:
          type: array
          items:
            type: string
    RepositoryCandidate:
      type: object
      additionalProperties: false
      required:
        - projectId
        - displayName
        - validated
        - evidence
      properties:
        projectId:
          type: string
        displayName:
          type: string
        validated:
          type: boolean
        evidence:
          type: array
          items:
            type: string
    UnassignedAttachRequest:
      type: object
      additionalProperties: false
      required:
        - projectId
        - immutableFingerprint
        - controlBindingId
        - ownershipFingerprint
        - reason
      properties:
        projectId:
          type: string
          description: One explicitly selected, currently validated repository.
        immutableFingerprint:
          type: string
        controlBindingId:
          type: string
        ownershipFingerprint:
          type: string
        reason:
          type: string
          minLength: 1
          maxLength: 300
    UnassignedRetirementPlanRequest:
      type: object
      additionalProperties: false
      required:
        - immutableFingerprint
        - controlBindingId
        - ownershipFingerprint
        - reason
      properties:
        immutableFingerprint:
          type: string
        controlBindingId:
          type: string
        ownershipFingerprint:
          type: string
        reason:
          type: string
          minLength: 1
          maxLength: 300
    UnassignedRetirementPlan:
      type: object
      additionalProperties: false
      required:
        - id
        - fingerprint
        - resourceId
        - immutableFingerprint
        - controlBindingId
        - ownershipFingerprint
        - effects
        - retained
        - deleted
        - blockers
        - confirmationPhrase
        - expiresAt
      properties:
        id:
          type: string
        fingerprint:
          type: string
        resourceId:
          type: string
        immutableFingerprint:
          type: string
        controlBindingId:
          type: string
        ownershipFingerprint:
          type: string
        effects:
          type: array
          description: Stop, automatic-start fence, and exact stopped-state verification.
