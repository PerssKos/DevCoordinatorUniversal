        id:
          type: string
        fingerprint:
          type: string
        action:
          type: string
          const: stop
        targets:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/BulkOperationTarget'
        blockers:
          type: array
          items:
            $ref: '#/components/schemas/Blocker'
        confirmationPhrase:
          type: string
        expiresAt:
          type: string
          format: date-time
    BulkOperationTarget:
      type: object
      additionalProperties: false
      required:
        - resourceId
        - displayName
        - kind
        - state
        - effects
        - blockers
      properties:
        resourceId:
          type: string
        displayName:
          type: string
        kind:
          type: string
          enum:
            - server
            - container
        state:
          $ref: '#/components/schemas/ResourceState'
        effects:
          type: array
          items:
            type: string
        blockers:
          type: array
          items:
            $ref: '#/components/schemas/Blocker'
    PerformanceHistory:
